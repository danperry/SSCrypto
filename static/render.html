<html>
<body>
	<script>
		// Everything after the # never leaves the browser. Format: base64 of the HTML.
		// This runs whatever HTML the link contains, so this site must never hold anything sensitive.
		const bytes = Uint8Array.from(atob(location.hash.slice(1)), c => c.charCodeAt(0));
		document.open();
		document.write(new TextDecoder().decode(bytes));
		document.close();
	</script>
</body>
</html>
